name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HUGO_VERSION: 0.169.0
  WRANGLER_VERSION: 4.152.0

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      # Deploy is skipped (build still runs) until the Cloudflare secrets are set.
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Hugo
        run: |
          cd "$RUNNER_TEMP"
          base="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          tarball="hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          curl -fsSLO "$base/$tarball"
          curl -fsSL "$base/hugo_${HUGO_VERSION}_checksums.txt" | grep " ${tarball}$" | sha256sum -c
          tar xzf "$tarball" hugo
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Build
        run: hugo --gc --minify

      - name: Deploy to Cloudflare
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && env.HAS_CLOUDFLARE == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          command: deploy

      - name: Note skipped deploy
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && env.HAS_CLOUDFLARE != 'true'
        run: echo "::notice::Built, not deployed. Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to deploy."
