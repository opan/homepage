<meta property="og:title" content="{{ .Title | default site.Title }}">
<meta property="og:url" content="{{ .Permalink }}">
<meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}">
{{/* Wide preview for pages with a cover image, a square avatar otherwise. */}}
{{ with .Resources.GetMatch "cover.*" }}
<meta property="og:image" content="{{ (.Fill "1200x630 webp top").Permalink }}">
<meta name="twitter:card" content="summary_large_image">
{{ else }}
{{ with resources.Get "images/avatar.jpg" }}<meta property="og:image" content="{{ (.Fill "400x400 webp").Permalink }}">{{ end }}
<meta name="twitter:card" content="summary">
{{ end }}
{{ with site.Params.x }}<meta name="twitter:site" content="@{{ . }}"><meta name="twitter:creator" content="@{{ . }}">{{ end }}
